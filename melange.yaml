package:
  name: solr-entrypoint
  version: 1.0.0
  epoch: 0
  description: Startup wrapper for wolfi solr
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm755 solr-entrypoint "${{targets.destdir}}"/usr/local/bin/solr-entrypoint
