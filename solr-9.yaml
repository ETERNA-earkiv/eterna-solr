# Solr 9 byggd från källkod. Wolfi har bara Solr 10 kvar, så detta är en
# port av Wolfis recept för solr 9.10.1-r4 (inkl. deras CVE-bumpar i versions.props).
package:
  name: solr-9
  version: 9.10.1
  epoch: 0
  description: Apache Solr open-source search software
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - build-base
      - busybox
      - openjdk-17-default-jvm
      - procps
      - tini

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash
      - build-base
      - ca-certificates-bundle
      - git
      - openjdk-17-default-jdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/solr
      tag: releases/solr/${{package.version}}
      expected-commit: c135e6335c7158fa26e96b0dc386f825255b47c0

  - runs: |
      sed -i -e 's|org.apache.zookeeper:\*=3.9.3|org.apache.zookeeper:\*=3.9.4|g' versions.props
      sed -i -e 's|com.jayway.jsonpath:json-path=2.8.0|com.jayway.jsonpath:json-path=2.9.0|g' versions.props
      sed -i -e 's|org.eclipse.jetty\*:\*=10.0.22|org.eclipse.jetty\*:\*=10.0.26|g' versions.props
      sed -i -e 's|org.apache.commons:commons-lang3=3.15.0|org.apache.commons:commons-lang3=3.18.0|g' versions.props
      sed -i -e 's|io.netty:\*=4.1.114.Final|io.netty:\*=4.1.127.Final|g' versions.props
      ./gradlew --write-locks
      ./gradlew dependencies

  - runs: |
      ./gradlew assembleDist

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/java/solr "${{targets.destdir}}"/opt
      tar --strip-components 1 -xf ./solr/packaging/build/distributions/solr-${{package.version}}-SNAPSHOT-slim.tgz \
        -C "${{targets.destdir}}"/usr/share/java/solr
      ln -sf /usr/share/java/solr "${{targets.destdir}}"/opt/solr
